<!DOCTYPE html>
<html lang="en" translate="no">

<head>
    <meta charset="UTF-8">
    <link class="favicon-link" rel="icon" type="image/png" href="../assets/favicons/favicon-96x96.png" sizes="96x96" />
    <link class="favicon-link" rel="icon" type="image/svg+xml" href="../assets/favicons/favicon.svg" />
    <link class="favicon-link" rel="shortcut icon" href="../assets/favicons/favicon.ico" />
    <link class="favicon-link" rel="apple-touch-icon" sizes="180x180" href="../assets/favicons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Motion Poster" />
    <link rel="manifest" href="../assets/favicons/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <script src="docs-theme-loader.js"></script>

    <!-- Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <title>Search &amp; Categories — Motion Poster Docs</title>
    <meta name="description" content="Browse articles and search results in the Motion Poster help center.">

    <!-- Docs Style Sheet -->
    <link rel="stylesheet" href="style.css">
    <script src="docs-components.js" type="module"></script>
</head>

<body class="user-docs-page docs-list-page">
    <div class="docs-app-viewport">
        <!-- Mobile Navigation Overlay -->
        <div id="mobile-overlay" class="mobile-overlay"></div>

        <main class="docs-layout-container">
            <div class="docs-content-column">
                <docs-header></docs-header>

                <!-- List Content Area -->
                <div class="list-container">
                    <!-- <a href="./" class="list-back-home">
                        <docs-logo></docs-logo>
                        <span class="back-link-text">← Help Center</span>
                    </a> -->
                    <header class="list-header">
                        <span class="list-category-badge" id="list-badge">Category</span>
                        <h1 id="list-title">Search Results</h1>
                        <p class="list-subtitle" id="list-subtitle">Showing articles matching your query.</p>

                        <!-- Search Box & Suggestions -->
                        <div class="list-search-wrapper">
                            <div class="list-search-box">
                                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                                <input type="search" id="list-search-input" placeholder="Search guides..."
                                    aria-label="Search guides" autocomplete="off" />
                            </div>
                            <div class="suggestion-pills">
                                <span class="suggestion-pill-label">Suggestions:</span>
                                <button class="suggestion-pill" data-type="query" data-value="Getting Started">Getting
                                    Started</button>
                                <button class="suggestion-pill" data-type="recent">Recently Updated</button>
                                <button class="suggestion-pill" data-type="category" data-value="Guides">Guides</button>
                            </div>
                        </div>
                    </header>

                    <div id="list-results" class="results-list">
                        <div class="list-loading">Loading articles...</div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <docs-footer></docs-footer>
    </div>

    <script src="docs-list.js"></script>
</body>

</html>
