<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Event Poster</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --color-bg: #032858;
            --color-bg-dark: #01142c;
            --color-accent: #f9d783;
            --color-accent-rgb: 249, 215, 131;
            --color-text: #ffffff;
            --font-display: 'Cinzel Decorative', Georgia, serif;
            --font-heading: 'Cinzel', Georgia, serif;
            --font-sans: 'Montserrat', system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, var(--color-bg) 0%, var(--color-bg-dark) 100%);
            color: var(--color-text);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient glow */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(var(--color-accent-rgb), 0.08) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
            animation: pulse 8s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(0.95);
                opacity: 0.8;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.05);
                opacity: 1;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 3rem 2.5rem;
            max-width: 550px;
            width: 90%;
            background: rgba(13, 17, 23, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Decorative Gold Frame Corner accents */
        .corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 1.5px solid var(--color-accent);
            pointer-events: none;
            opacity: 0.8;
        }

        .corner-tl {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }

        .corner-tr {
            top: 20px;
            right: 20px;
            border-left: none;
            border-bottom: none;
        }

        .corner-bl {
            bottom: 20px;
            left: 20px;
            border-right: none;
            border-top: none;
        }

        .corner-br {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
        }

        .error-code {
            font-family: var(--font-heading);
            font-size: 3.5rem;
            line-height: 1;
            color: var(--color-accent);
            text-shadow: 0 0 30px rgba(var(--color-accent-rgb), 0.3),
                0 4px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 1rem;
            letter-spacing: 2px;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .title {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 1.2rem;
            color: var(--color-text);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .description {
            font-size: 1.05rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        @media (min-width: 480px) {
            .actions {
                flex-direction: row;
                justify-content: center;
            }
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 30px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .button-primary {
            background: var(--color-accent);
            color: var(--color-bg-dark);
            box-shadow: 0 4px 15px rgba(var(--color-accent-rgb), 0.3);
        }

        .button-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(var(--color-accent-rgb), 0.5);
            filter: brightness(1.08);
        }

        .button-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--color-text);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
        }

        .button-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .button:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <div class="ambient-glow"></div>

    <div class="container">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <div class="error-code">Motion Poster</div>
        <p class="description">
            The requested page does not exist. Use the options below to find your way back.
        </p>
        <h1 class="title">Choose View</h1>

        <div class="actions">
            <a href="/remote/" class="button button-secondary">Remote Controller</a>
            <a href="/" class="button button-primary">Poster Display</a>
        </div>
    </div>
</body>

</html>
