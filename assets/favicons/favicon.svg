<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a3d7a"/>
      <stop offset="1" stop-color="#021c3f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d4a94"/>
      <stop offset="1" stop-color="#042a58"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde9ae"/>
      <stop offset="1" stop-color="#f2c45c"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <g filter="url(#lift)">
    <rect x="14" y="34" width="152" height="112" rx="10" fill="url(#screen)" stroke="url(#gold)" stroke-width="7"/>
  </g>
  <g transform="translate(90 90)" fill="url(#gold)">
    <ellipse cx="0" cy="-21" rx="15.500" ry="21"/>
    <ellipse cx="0" cy="-21" rx="15.500" ry="21" transform="rotate(72)"/>
    <ellipse cx="0" cy="-21" rx="15.500" ry="21" transform="rotate(144)"/>
    <ellipse cx="0" cy="-21" rx="15.500" ry="21" transform="rotate(216)"/>
    <ellipse cx="0" cy="-21" rx="15.500" ry="21" transform="rotate(288)"/>
  </g>
  <circle cx="90" cy="90" r="7.500" fill="#042a58"/>
</svg>
